<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthPulse - Advanced BMI & AI Calorie Tracker</title>
    <style>
        :root {
            --bg-color: #095c47;
            --card-bg: #0d735b;
            --text-color: #ffffff;
            --accent-green: #34d399;
            --accent-gold: #fbbf24;
            --accent-red: #ff6b6b;
            --accent-blue: #38bdf8;
            --border-color: #149174;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding-bottom: 85px;
        }
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.4rem;
            margin: 0;
            color: var(--accent-gold);
        }
        .unit-toggle {
            display: flex;
            background-color: #064032;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .unit-btn {
            background: none;
            border: none;
            color: #cbd5e1;
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }
        .unit-btn.active {
            background-color: var(--accent-gold);
            color: #064032;
        }
        .nav-tabs {
            display: flex;
            background-color: #064032;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }
        .nav-tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: #cbd5e1;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
        }
        .nav-tab-btn.active {
            background-color: var(--accent-gold);
            color: #064032;
        }
        .tab-pane {
            display: none;
        }
        .tab-pane.active {
            display: block;
        }
        .box {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #e2e8f0;
            display: block;
            margin-bottom: 6px;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #064032;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            -webkit-appearance: none;
        }
        input::placeholder {
            color: #94a3b8;
        }
        input:focus, select:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.2);
        }
        select option {
            background-color: #064032;
            color: #ffffff;
        }
        .row-inputs {
            display: flex;
            gap: 10px;
        }
        button.action-btn {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #064032;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            padding: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            margin-bottom: 0;
        }
        .result-card {
            background: linear-gradient(135deg, #0d735b, #0b614c);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 16px;
            border: 1px solid #149174;
            display: none;
        }
        .result-bmi {
            font-size: 2.8rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin: 6px 0;
        }
        .result-category {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .result-advice {
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin-bottom: 12px;
        }
        .history-item {
            background-color: #064032;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            gap: 12px;
        }
        .history-info {
            flex: 1;
            min-width: 0;
        }
        .history-info strong {
            display: block;
            font-size: 0.95rem;
            color: #ffffff;
            margin-bottom: 2px;
        }
        .history-info span {
            display: block;
            color: #cbd5e1;
            font-size: 0.8rem;
            line-height: 1.3;
        }
        .del-btn-round {
            background-color: #ef4444;
            color: #fff;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
        }
        .calorie-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .cal-box {
            background-color: #064032;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .cal-box span {
            display: block;
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-bottom: 4px;
        }
        .cal-box strong {
            font-size: 1.4rem;
            color: var(--accent-gold);
        }
        .camera-preview {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            display: none;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-header">
        <h1>HealthPulse</h1>
        <div class="unit-toggle" id="unitToggleContainer">
            <button id="metricBtn" class="unit-btn active" onclick="setUnit('metric')">Metric</button>
            <button id="imperialBtn" class="unit-btn" onclick="setUnit('imperial')">Imperial</button>
        </div>
    </div>

    <!-- MAIN APP TABS -->
    <div class="nav-tabs">
        <button id="tabBmiBtn" class="nav-tab-btn active" onclick="switchTab('bmi')">BMI & Profile</button>
        <button id="tabCalBtn" class="nav-tab-btn" onclick="switchTab('calories')">Calorie Meter</button>
        <button id="tabAiBtn" class="nav-tab-btn" onclick="switchTab('aiScanner')">AI Scan</button>
    </div>

    <!-- TAB 1: BMI & PROFILE -->
    <div id="paneBmi" class="tab-pane active">
        <div class="box">
            <form id="bmiForm" onsubmit="calculateBMI(event)">
                <div class="row-inputs">
                    <div style="flex:1;">
                        <label>Age</label>
                        <input type="number" id="userAge" placeholder="Years" min="1" max="120" inputmode="numeric" required>
                    </div>
                    <div style="flex:1;">
                        <label>Gender</label>
                        <select id="userGender">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div id="metricInputs">
                    <label>Height (cm)</label>
                    <input type="number" id="heightCm" placeholder="e.g. 175" step="any" inputmode="decimal">
                    
                    <label>Weight (kg)</label>
                    <input type="number" id="weightKg" placeholder="e.g. 70" step="any" inputmode="decimal">
                </div>

                <div id="imperialInputs" style="display: none;">
                    <label>Height</label>
                    <div class="row-inputs">
                        <input type="number" id="heightFt" placeholder="Feet" step="1" inputmode="numeric">
                        <input type="number" id="heightIn" placeholder="Inches" step="any" inputmode="decimal">
                    </div>
                    
                    <label>Weight (lbs)</label>
                    <input type="number" id="weightLbs" placeholder="e.g. 154" step="any" inputmode="decimal">
                </div>

                <label>Activity Level</label>
                <select id="activityLevel">
                    <option value="1.2">Sedentary (little or no exercise)</option>
                    <option value="1.375">Lightly active (light exercise/sports 1-3 days/week)</option>
                    <option value="1.55" selected>Moderately active (moderate exercise/sports 3-5 days/week)</option>
                    <option value="1.725">Very active (hard exercise/sports 6-7 days a week)</option>
                </select>

                <button type="submit" class="action-btn">Calculate BMI & Plan</button>
            </form>
        </div>

        <!-- RESULT CARD -->
        <div id="resultCard" class="result-card">
            <div style="font-size: 0.85rem; font-weight: 600; color: #cbd5e1;">Your BMI Score & Daily Calorie Needs</div>
            <div class="result-bmi" id="bmiValue">0.0</div>
            <div class="result-category" id="bmiCategory">-</div>
            <div class="result-advice" id="bmiAdvice" style="margin-bottom:8px;">-</div>
            <div style="font-size:0.85rem; color:var(--accent-gold); font-weight:bold;" id="bmrInfo">-</div>
        </div>

        <!-- HISTORY SECTION -->
        <div class="section-title">Calculation History</div>
        <div id="historyList"></div>
    </div>

    <!-- TAB 2: CALORIE METER -->
    <div id="tabPaneCal" class="tab-pane">
        <div class="calorie-summary">
            <div class="cal-box">
                <span>Daily Target</span>
                <strong id="targetCalDisplay">2,000</strong>
            </div>
            <div class="cal-box">
                <span>Total Consumed</span>
                <strong id="consumedCalDisplay" style="color:#34d399;">0</strong>
            </div>
        </div>

        <div class="box">
            <form id="foodForm" onsubmit="addFoodItem(event)">
                <label>Food Item Name</label>
                <input type="text" id="foodName" placeholder="e.g. Oatmeal, Chicken Salad" autocomplete="off" required>

                <label>Calories (kcal)</label>
                <input type="number" id="foodCalories" placeholder="e.g. 350" inputmode="numeric" required>

                <button type="submit" class="action-btn">Add to Daily Log</button>
            </form>
        </div>

        <div class="section-title">Today's Food Log</div>
        <div id="foodList"></div>
    </div>

    <!-- TAB 3: AI SCANNER -->
    <div id="tabPaneAi" class="tab-pane">
        <div class="box">
            <div class="section-title" style="margin-bottom:8px;">AI Food & Drink Analyzer</div>
            <p style="font-size:0.82rem; color:#cbd5e1; margin-bottom:14px;">Upload or take a picture of your food/drink. Our visual analysis tool estimates the contents and logs the calories instantly.</p>
            
            <input type="file" id="foodImageInput" accept="image/*" capture="environment" style="display:none;" onchange="handleImageUpload(event)">
            <button class="action-btn" style="margin-bottom:10px;" onclick="document.getElementById('foodImageInput').click()">📷 Take / Upload Picture</button>
            
            <img id="imagePreview" class="camera-preview" alt="Food Preview">
            
            <div id="aiAnalysisResult" style="display:none; margin-top:14px; background:#064032; padding:12px; border-radius:8px; border:1px solid var(--border-color);">
                <strong id="aiFoodName" style="display:block; color:var(--accent-gold); margin-bottom:4px;">-</strong>
                <span id="aiFoodCals" style="display:block; font-size:0.9rem; color:#34d399; margin-bottom:8px;">-</span>
                <button class="action-btn" onclick="logAiFood()" style="font-size:0.85rem; padding:8px;">Add to Daily Log</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUnit = 'metric';
    let history = JSON.parse(localStorage.getItem('hp_history')) || [];
    let foodLog = JSON.parse(localStorage.getItem('hp_foodlog')) || [];
    let dailyTargetCal = parseInt(localStorage.getItem('hp_targetcal')) || 2000;
    let pendingAiFood = null;

    function setUnit(unit) {
        currentUnit = unit;
        document.getElementById('metricBtn').classList.toggle('active', unit === 'metric');
        document.getElementById('imperialBtn').classList.toggle('active', unit === 'imperial');
        
        document.getElementById('metricInputs').style.display = unit === 'metric' ? 'block' : 'none';
        document.getElementById('imperialInputs').style.display = unit === 'imperial' ? 'block' : 'none';
    }

    function switchTab(tab) {
        document.getElementById('paneBmi').classList.toggle('active', tab === 'bmi');
        document.getElementById('tabPaneCal').classList.toggle('active', tab === 'calories');
        document.getElementById('tabPaneAi').classList.toggle('active', tab === 'aiScanner');
        
        document.getElementById('tabBmiBtn').classList.toggle('active', tab === 'bmi');
        document.getElementById('tabCalBtn').classList.toggle('active', tab === 'calories');
        document.getElementById('tabAiBtn').classList.toggle('active', tab === 'aiScanner');

        document.getElementById('unitToggleContainer').style.display = tab === 'bmi' ? 'flex' : 'none';
    }

    function calculateBMI(e) {
        e.preventDefault();
        let age = parseInt(document.getElementById('userAge').value);
        let gender = document.getElementById('userGender').value;
        let activityMultiplier = parseFloat(document.getElementById('activityLevel').value);
        
        let bmi = 0;
        let weightKgCalc = 0;
        let heightCmCalc = 0;
        let details = '';

        if (currentUnit === 'metric') {
            heightCmCalc = parseFloat(document.getElementById('heightCm').value);
            weightKgCalc = parseFloat(document.getElementById('weightKg').value);
            if (!heightCmCalc || !weightKgCalc || heightCmCalc <= 0 || weightKgCalc <= 0) return alert('Please enter valid measurements.');
            
            let m = heightCmCalc / 100;
            bmi = weightKgCalc / (m * m);
            details = `${age} yrs, ${gender}, ${weightKgCalc} kg, ${heightCmCalc} cm`;
        } else {
            let ft = parseFloat(document.getElementById('heightFt').value) || 0;
            let inches = parseFloat(document.getElementById('heightIn').value) || 0;
            let lbs = parseFloat(document.getElementById('weightLbs').value);
            
            let totalInches = (ft * 12) + inches;
            if (!totalInches || !lbs || totalInches <= 0 || lbs <= 0) return alert('Please enter valid measurements.');

            bmi = (lbs / (totalInches * totalInches)) * 703;
            weightKgCalc = lbs * 0.453592;
            heightCmCalc = totalInches * 2.54;
            details = `${age} yrs, ${gender}, ${lbs} lbs, ${ft}'${inches}"`;
        }

        bmi = Math.round(bmi * 10) / 10;
        let { category, color, advice } = getCategoryData(bmi);

        let bmr = (10 * weightKgCalc) + (6.25 * heightCmCalc) - (5 * age);
        if (gender === 'Male') {
            bmr += 5;
        } else {
            bmr -= 161;
        }
        let maintenanceCalories = Math.round(bmr * activityMultiplier);
        dailyTargetCal = maintenanceCalories;
        localStorage.setItem('hp_targetcal', dailyTargetCal);

        let resCard = document.getElementById('resultCard');
        resCard.style.display = 'block';
        document.getElementById('bmiValue').textContent = bmi;
        document.getElementById('bmiCategory').textContent = category;
        document.getElementById('bmiCategory').style.color = color;
        document.getElementById('bmiAdvice').textContent = advice;
        document.getElementById('bmrInfo').textContent = `Estimated Daily Maintenance Calories: ${maintenanceCalories} kcal/day`;

        let dateStr = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        history.unshift({ bmi, category, details, date: dateStr });
        if (history.length > 10) history.pop();
        localStorage.setItem('hp_history', JSON.stringify(history));
        renderHistory();
        renderCalories();
    }

    function getCategoryData(bmi) {
        if (bmi < 18.5) {
            return { category: 'Underweight', color: '#38bdf8', advice: 'Consider consulting a nutritionist to achieve a healthier weight balance.' };
        } else if (bmi >= 18.5 && bmi < 25) {
            return { category: 'Normal Weight', color: '#34d399', advice: 'Great job! Maintain your balanced diet and active lifestyle.' };
        } else if (bmi >= 25 && bmi < 30) {
            return { category: 'Overweight', color: '#fbbf24', advice: 'Incorporating regular aerobic exercise and mindful eating can help.' };
        } else {
            return { category: 'Obese', color: '#ff6b6b', advice: 'It is recommended to speak with a healthcare provider for personalized guidance.' };
        }
    }

    function renderHistory() {
        let listEl = document.getElementById('historyList');
        if (history.length === 0) {
            listEl.innerHTML = '<p style="text-align:center; color:#cbd5e1; font-size:0.85rem;">No past calculations yet.</p>';
            return;
        }

        let html = '';
        history.forEach((h, idx) => {
            html += `
                <div class="history-item">
                    <div class="history-info">
                        <strong>BMI ${h.bmi} - ${h.category}</strong>
                        <span>${h.details} &bull; ${h.date}</span>
                    </div>
                    <button class="del-btn-round" onclick="deleteHistory(${idx})" title="Delete">&times;</button>
                </div>`;
        });
        listEl.innerHTML = html;
    }

    function deleteHistory(idx) {
        history.splice(idx, 1);
        localStorage.setItem('hp_history', JSON.stringify(history));
        renderHistory();
    }

    function addFoodItem(e) {
        e.preventDefault();
        let name = document.getElementById('foodName').value.trim();
        let cals = parseInt(document.getElementById('foodCalories').value);

        if (!name || isNaN(cals) || cals <= 0) return alert('Please enter valid food details.');

        foodLog.unshift({ name, cals });
        localStorage.setItem('hp_foodlog', JSON.stringify(foodLog));
        document.getElementById('foodForm').reset();
        renderCalories();
    }

    function deleteFoodItem(idx) {
        foodLog.splice(idx, 1);
        localStorage.setItem('hp_foodlog', JSON.stringify(foodLog));
        renderCalories();
    }

    function renderCalories() {
        document.getElementById('targetCalDisplay').textContent = dailyTargetCal.toLocaleString();
        
        let totalConsumed = foodLog.reduce((sum, item) => sum + item.cals, 0);
        document.getElementById('consumedCalDisplay').textContent = totalConsumed.toLocaleString();

        let listEl = document.getElementById('foodList');
        if (foodLog.length === 0) {
            listEl.innerHTML = '<p style="text-align:center; color:#cbd5e1; font-size:0.85rem;">No food logged for today yet.</p>';
            return;
        }

        let html = '';
        foodLog.forEach((f, idx) => {
            html += `
                <div class="history-item">
                    <div class="history-info">
                        <strong>${f.name}</strong>
                        <span>${f.cals} kcal</span>
                    </div>
                    <button class="del-btn-round" onclick="deleteFoodItem(${idx})" title="Delete">&times;</button>
                </div>`;
        });
        listEl.innerHTML = html;
    }

    function handleImageUpload(event) {
        let file = event.target.files[0];
        if (!file) return;

        let reader = new FileReader();
        reader.onload = function(e) {
            let imgPrev = document.getElementById('imagePreview');
            imgPrev.src = e.target.result;
            imgPrev.style.display = 'block';

            // Simulate intelligent image analysis (randomized realistic food estimation mock)
            let mockFoods = [
                { name: 'Grilled Chicken Salad with Vinaigrette', cals: 340 },
                { name: 'Avocado Toast with Poached Egg', cals: 290 },
                { name: 'Classic Pepperoni Slice Pizza', cals: 380 },
                { name: 'Fresh Fruit Smoothie Bowl', cals: 250 },
                { name: 'Cheeseburger with Small Fries', cals: 650 },
                { name: 'Steamed Rice with Mixed Vegetables', cals: 310 }
            ];
            let detected = mockFoods[Math.floor(Math.random() * mockFoods.length)];
            pendingAiFood = detected;

            document.getElementById('aiFoodName').textContent = `Detected: ${detected.name}`;
            document.getElementById('aiFoodCals').textContent = `Estimated Energy: ~${detected.cals} kcal`;
            document.getElementById('aiAnalysisResult').style.display = 'block';
        };
        reader.readAsDataURL(file);
    }

    function logAiFood() {
        if (!pendingAiFood) return;
        foodLog.unshift({ name: pendingAiFood.name, cals: pendingAiFood.cals });
        localStorage.setItem('hp_foodlog', JSON.stringify(foodLog));
        renderCalories();
        
        // Reset scanner UI and switch to Calorie Meter tab
        document.getElementById('aiAnalysisResult').style.display = 'none';
        document.getElementById('imagePreview').style.display = 'none';
        document.getElementById('foodImageInput').value = '';
        pendingAiFood = null;
        switchTab('calories');
    }

    renderHistory();
    renderCalories();
</script>

</body>
</html>
